name: Build community MCP
on:
  workflow_dispatch:
  push:
    branches: [community/selfhost-api-parity]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'Manan-Santoki/firecrawl-mcp-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable revision
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/manan-santoki/firecrawl-mcp-community:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Manan-Santoki/firecrawl-mcp-server
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record deployment image
        run: echo 'Use the image digest reported by the build step. Entrypoint node dist/selfhost.js.' >> "$GITHUB_STEP_SUMMARY"
